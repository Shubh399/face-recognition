<!doctype html>
<html>
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Mark Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container my-4">
  <div class="card p-4 shadow-sm">
    <div class="d-flex justify-content-between align-items-center">
      <h4>Mark Attendance (Live)</h4>
      <div>
        <button id="detectMarkCameraBtn" class="btn btn-outline-primary">Detect cameras</button>
        <button id="startMarkBtn" class="btn btn-primary">Start</button>
        <button id="stopMarkBtn" class="btn btn-danger" disabled>Stop</button>
        <form method="post" action="{{ url_for('logout') }}" class="d-inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-outline-secondary" type="submit">Log out</button>
        </form>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-7 text-center">
        <label class="form-label" for="markCameraSelect">Webcam (choose the laptop's built-in webcam)</label>
        <select id="markCameraSelect" class="form-select mb-3" disabled>
          <option value="">Detect cameras first</option>
        </select>
        <video id="markVideo" width="560" height="420" autoplay muted style="border-radius:10px;border:2px solid #e2e8f0;"></video>
        <div id="markStatus" class="mt-2 small text-muted">Waiting...</div>
      </div>
      <div class="col-md-5">
        <h6>Recognized (session)</h6>
        <ul id="recognizedList" class="list-group"></ul>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/camera_picker.js') }}"></script>
<script src="{{ url_for('static', filename='js/camera_mark.js') }}"></script>
</body>
</html>
