<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Digital Attendance Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar, .right-panel::-webkit-scrollbar {
      display: none;
    }

    /* Right panel column */
    .right-panel {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: clamp(0.75rem, 3vw, 2rem);
      background: transparent;
      overflow-y: visible;
    }

    .nav-surface {
      background: rgba(255, 255, 255, 0.82);
      margin-bottom: 1.5rem;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 1rem;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.045);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.92);
    }

    .progress {
      background-color: #e8e8ed;
      border-radius: 10px;
    }
    .progress-bar {
      background: #0071e3;
      font-weight: 600;
    }

    .nav-surface .container-fluid,
    .nav-surface .container-fluid > .d-flex {
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chart-container {
      height: clamp(260px, 42vw, 320px) !important;
    }

    @media (max-width: 992px) {
      .right-panel { max-width: 100%; }
    }

    @media (max-width: 768px) {
      .right-panel { padding: 0.75rem; }
      .nav-surface { padding-block: 0.5rem; }
      .nav-surface .container-fluid > .d-flex {
        width: 100%;
        justify-content: flex-start;
      }
      .nav-surface .container-fluid > .d-flex form {
        margin-left: 0 !important;
      }
      .nav-surface .btn {
        flex: 1 1 auto;
      }
      .right-panel .container {
        padding-right: 0;
        padding-left: 0;
      }
      .right-panel .card {
        padding: 1rem !important;
      }
      #attendanceAnalysisSelect {
        width: 100%;
        max-width: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="right-panel">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light nav-surface shadow-sm px-3">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">Digital Attendance</a>
        <div class="d-flex">
          <a class="btn btn-outline-secondary me-2" href="/add_student">Add Student</a>
          <a class="btn btn-outline-secondary me-2" href="/classes">Classes</a>
          <a class="btn btn-outline-secondary me-2" href="/mark_attendance">Mark Attendance</a>
          <a class="btn btn-outline-secondary" href="/attendance_record">Records</a>
          <form method="post" action="{{ url_for('logout') }}" class="ms-2">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-outline-secondary" type="submit">Log out</button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Dashboard Content -->
    <!-- Use .container instead of container-fluid to avoid full-width stretch -->
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card p-3 shadow-sm glass-card">
            <h5>Quick Actions</h5>
            <p class="small text-muted">Create student entries, capture faces, or start recognition.</p>
            <div class="d-grid gap-2">
              <a class="btn btn-primary" href="/add_student">Add Student</a>
              <a class="btn btn-outline-primary" href="/classes">Create / View Classes</a>
              <a class="btn btn-success" href="/mark_attendance">Mark Attendance</a>
              <a class="btn btn-warning" href="/attendance_record">View Records</a>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card p-3 shadow-sm glass-card">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="mb-0">Train Model</h5>
              <button id="trainBtn" class="btn btn-outline-primary">Start Training</button>
            </div>
            <div class="mt-3">
              <div class="progress" style="height:28px;">
                <div id="trainProgress" class="progress-bar" style="width:0%">0%</div>
              </div>
              <div id="trainMsg" class="mt-2 text-muted small">Model not trained yet.</div>
            </div>
          </div>

          <div class="card p-3 shadow-sm mt-4 glass-card">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <h5 id="attendanceChartTitle" class="mb-0">Attendance (Last 30 days)</h5>
              <label class="visually-hidden" for="attendanceAnalysisSelect">Attendance analysis</label>
              <select id="attendanceAnalysisSelect" class="form-select" style="max-width: 260px;">
                <option value="daily">Daily attendance (last 30 days)</option>
                <option value="students">Student-wise attendance</option>
                <option value="classes">Class-wise attendance</option>
              </select>
            </div>
            <div class="chart-container" style="position:relative; height:320px; width:100%;">
               <canvas id="attendanceChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
